{% extends "base.html" %}

{% block content %}
<div class="page-header d-flex justify-content-between align-items-center">
    <div>
        <h1 class="h3">Employees</h1>
        <p class="text-muted">Internal employee overview</p>
    </div>
    <a class="btn btn-outline-secondary" href="/dashboard">Back</a>
</div>

<div class="card">
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="table-light">
            <tr>
                <th>Name</th>
                <th>Department</th>
                <th>Position</th>
                <th>Email</th>
            </tr>
            </thead>
            <tbody>
            {% for e in employees %}
            <tr>
                <td>
                    <a href="/employees/{{ e.id }}">
                        {{ e.first_name }} {{ e.last_name }}
                    </a>
                </td>
                <td>{{ e.department }}</td>
                <td>{{ e.position }}</td>
                <td>{{ e.email }}</td>
            </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
